[project]
name = "pss-client"
version = "0.1.0"
description = "Cliente Python para la API de Pixel Starships (backend de autenticación)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ruuuberth" }]
keywords = ["Pixel Starships", "PSS", "API", "client"]
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Repository = "https://github.com/ruuuberth/pss-client"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pss_client*"]