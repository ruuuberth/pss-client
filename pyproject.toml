[project]
name = "pss-client"
version = "0.1.0"
description = "Cliente Python para la API de Pixel Starships (backend de autenticación)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ruuuberth" }]
keywords = ["Pixel Starships", "PSS", "API", "client"]
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Repository = "https://github.com/ruuuberth/pss-client"

[project.optional-dependencies]
# Suite de tests (CI: pip install -e ".[dev]" && pytest)
dev = [
    "pytest>=8",
    "anyio>=4",  # plugin pytest de anyio: backends asyncio para tests async
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pss_client*"]